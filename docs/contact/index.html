<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact the Author</title>
  <link rel="stylesheet" href="/oat.css">
</head>
<body data-sidebar-layout>
  <nav data-topnav>
    <button data-sidebar-toggle aria-label="Toggle sidebar" class="btn">☰</button>
    <a href="/" class="brand" style="margin-left:0.5rem; font-weight:700;">Culinary Keepsakes</a>
    <div style="flex:1"></div>
    <button id="theme-toggle" class="btn" aria-label="Toggle theme">Theme</button>
  </nav>

  <aside data-sidebar>
    <nav>
      <a href="/">Home</a>
      <a href="/all-recipes/">All Recipes</a>
      <a href="/authors/">Authors</a>
      <a href="/contact/">Contact</a>
    </nav>
  </aside>

  <main class="wrap">
    <div class="container">
      <div><h1>Contact the Author</h1><p><a href="/">< Back Home</a></p><p>GitHub: <a href="https://github.com/Fepozopo">Fepozopo</a></p><p>For my lovely wife: click <a href="/valentine">here</a>...</p></div>
    </div>
  </main>

  <script src="/oat.js" defer></script>
  <script>
    (function() {
      const doc = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) doc.setAttribute('data-theme', saved);
      else if (!doc.getAttribute('data-theme')) doc.setAttribute('data-theme','dark');

      const btn = document.getElementById('theme-toggle');
      if (btn) btn.addEventListener('click', () => {
        const next = doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        doc.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
