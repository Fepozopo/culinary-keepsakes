  <main class="wrap">
    <div class="container">
      <div><h1>Authors</h1><p><div class="recipe-header">
<span class="subtitle">Authors (A-Z)</span>
<nav class="recipe-nav" aria-label="Recipe navigation">
<a href="/">HOME</a>

</div></p><p><div class="row" style="margin-top:2em; gap:1rem;">

</div></p></div>
    </div>
  </main>

  <script src="/oat.js" defer></script>
  <script>
    (function() {
      const doc = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) doc.setAttribute('data-theme', saved);
      else if (!doc.getAttribute('data-theme')) doc.setAttribute('data-theme','dark');

      const btn = document.getElementById('theme-toggle');
      if (btn) btn.addEventListener('click', () => {
        const next = doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        doc.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
