<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jean Navin's Recipes</title>
  <link rel="stylesheet" href="/oat.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body data-sidebar-layout>
  <nav data-topnav>
    <button data-sidebar-toggle aria-label="Toggle sidebar" class="btn">☰</button>
    <a href="/" class="brand" style="margin-left:0.5rem; font-weight:700;">Culinary Keepsakes</a>
    <div style="flex:1"></div>
    <button id="theme-toggle" class="btn" aria-label="Toggle theme">Theme</button>
  </nav>

  <aside data-sidebar>
    <nav>
      <a href="/">Home</a>
      <a href="/all-recipes/">All Recipes</a>
      <a href="/authors/">Authors</a>
      <a href="/contact/">Contact</a>
    </nav>
  </aside>

  <main class="wrap">
    <div class="container">
      <div><h1>Jean Navin's Recipes</h1><p><div class="recipe-header"></div></p><p><div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5em; margin-top: 2em; margin-bottom: 2em;">
<a href="/recipes/candied-cherry-cookies/jean-navin/" style="text-align: center; text-decoration: none; color: inherit;">
<img src="/images/candied-cherry-cookies.webp" alt="Candied Cherry Cookies" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; max-width: 300px; margin: 0 auto; display: block; border-radius: 8px;" />
<div style="margin-top: 0.5em; font-weight: bold;">Candied Cherry Cookies</div>
<div class="author">Jean Navin</div>
</a>
<a href="/recipes/milk-caramels/jean-navin/" style="text-align: center; text-decoration: none; color: inherit;">
<img src="/images/milk-caramels.webp" alt="Milk Caramels" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; max-width: 300px; margin: 0 auto; display: block; border-radius: 8px;" />
<div style="margin-top: 0.5em; font-weight: bold;">Milk Caramels</div>
<div class="author">Jean Navin</div>
</a>
<div></div>
</div></p></div>
    </div>
  </main>

  <script src="/oat.js" defer></script>
  <script>
    (function() {
      const doc = document.documentElement;
      const saved = localStorage.getItem('theme');
      if (saved) doc.setAttribute('data-theme', saved);
      else if (!doc.getAttribute('data-theme')) doc.setAttribute('data-theme','dark');

      const btn = document.getElementById('theme-toggle');
      if (btn) btn.addEventListener('click', () => {
        const next = doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        doc.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
